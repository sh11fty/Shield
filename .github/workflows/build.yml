name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: guardian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            APK from commit ${{ github.sha }}, signed with the fixed Harbor key (package `com.guardian.app`).

            First install (once):
            ```
            adb install app-debug.apk
            adb shell dpm set-device-owner com.guardian.app/com.guardian.app.GuardianAdminReceiver
            adb shell pm grant com.guardian.app android.permission.WRITE_SECURE_SETTINGS
            ```
            Update over an existing fixed-key build (keeps Device Owner and settings):
            ```
            adb install -r app-debug.apk
            ```
          files: app/build/outputs/apk/debug/app-debug.apk
